name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ==========================================
      # CHECKOUT CODE
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # RUN TESTS
      # ==========================================

      - name: Run tests
        run: |
          pytest

      # ==========================================
      # RUN COVERAGE
      # ==========================================

      - name: Run coverage
        run: |
          pytest --cov=etl

      # ==========================================
      # RUN LINT
      # ==========================================

      - name: Run flake8
        run: |
          flake8 etl